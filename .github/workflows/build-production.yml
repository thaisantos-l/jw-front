name: Frontend build artifact
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jw-build-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  build:
    if: github.repository == 'thaisantos-l/jw-front' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORDPRESS_GRAPHQL_URL: ${{ vars.WORDPRESS_GRAPHQL_URL }}
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Build from production CMS
        run: pnpm build
      - run: pnpm verify:export
      - name: Package immutable release
        run: python3 scripts/deploy/release.py package
      - name: Upload release
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jw-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .deploy/release.zip
            .deploy/release.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Show deployment IDs
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        run: |
          {
            echo '### Ready for manual publication'
            printf '\n- build_run_id: `%s`\n- artifact_id: `%s`\n- commit: `%s`\n' "$GITHUB_RUN_ID" "$ARTIFACT_ID" "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
